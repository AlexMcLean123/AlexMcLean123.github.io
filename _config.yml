# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Smart Feed
    description                           : Discover what matters to you. Get advice, share stories, and have the craic with intelligent filtering that shows you the most relevant posts from your Irish community.
    fontawesome_icon_name                 : stream

  - title                                 : Housing Hub
    description                           : Find your new home with confidence. Browse location-based property listings with smart insights on local amenities, transport links, and Irish-friendly neighborhoods.
    fontawesome_icon_name                 : home

  - title                                 : AI-Curated Events
    description                           : Never go solo again. Discover Irish events tailored to your interests, RSVP instantly, and connect with other attendees before you even arrive.
    fontawesome_icon_name                 : calendar-check

  - title                                 : Connect & Message
    description                           : Break the ice easily. Message fellow solo attendees, join group chats for events, and build your social circle in your new city.
    fontawesome_icon_name                 : comments

  - title                                 : Earn Rewards
    description                           : Get recognized for being active in your ciorcal. Earn badges for contributing to the community and unlock exclusive rewards, including cash prizes.
    fontawesome_icon_name                 : award

  - title                                 : Location-Smart
    description                           : Everything you need, right where you are. Our smart geolocation shows you housing, events, and community members near you, making settling in easier.
    fontawesome_icon_name                 : map-marked-alt



