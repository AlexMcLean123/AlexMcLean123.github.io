<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - Ciorcal</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/Icon-App-60x60@3x.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #09090b;
            font-family: 'Satoshi', system-ui, -apple-system, sans-serif;
        }

        .icon-glow {
            box-shadow: 0 0 60px rgba(107, 155, 107, 0.25);
        }
    </style>
</head>
<body class="text-zinc-100 antialiased min-h-screen flex items-center justify-center px-6">
    <div class="text-center max-w-md">
        <div class="mb-8">
            <div class="w-20 h-20 mx-auto rounded-full bg-[#6b9b6b]/10 flex items-center justify-center mb-6">
                <svg class="w-10 h-10 text-[#6b9b6b]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold mb-4">Email Verified</h1>
            <p class="text-zinc-400 text-lg mb-8">
                Your email has been verified successfully. You can now return to the app and sign in.
            </p>
        </div>

        <a href="/" class="inline-block bg-gradient-to-br from-[#6b9b6b] to-[#528552] text-white px-8 py-3 rounded-full font-medium hover:opacity-90 transition-opacity">
            Back to ciorcal
        </a>

        <p class="text-zinc-500 text-sm mt-10">
            Need help? Contact us at <a href="mailto:hello@ciorcal.io" class="text-[#6b9b6b] hover:underline">hello@ciorcal.io</a>
        </p>
    </div>
</body>
</html>
